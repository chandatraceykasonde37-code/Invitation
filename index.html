<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>James & Chileshe | Wedding Countdown</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;

            background: linear-gradient(
                135deg,
                #E5D5BF,
                #F2E9DC,
                #D8C5AE
            );

            font-family: 'Lato', sans-serif;
        }

        .card {
            width: 100%;
            max-width: 650px;
            padding: 55px 35px;

            text-align: center;

            background: linear-gradient(
                145deg,
                #FFFDF7,
                #F8F1E7,
                #F2E9DC
            );

            border: 1px solid #C9AD91;
            border-radius: 12px;

            box-shadow:
                0 15px 45px rgba(93, 67, 45, 0.15);
        }

        .decoration {
            color: #A87952;
            font-size: 25px;
            margin-bottom: 22px;
        }

        .heading {
            color: #8B7968;
            font-size: 11px;
            letter-spacing: 4px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(48px, 10vw, 75px);
            color: #A87952;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #8B7968;
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        .line {
            width: 75px;
            height: 1px;
            background: #B99A7A;
            margin: 25px auto;
        }

        .date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            color: #765A43;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .time {
            font-size: 12px;
            color: #8B7968;
            letter-spacing: 3px;
        }

        .countdown-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 23px;
            color: #8B7968;
            letter-spacing: 2px;
            margin: 30px 0 22px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .box {
            background: linear-gradient(
                145deg,
                #F5EBDD,
                #E8D9C6
            );

            border: 1px solid #D5BFA7;
            border-radius: 8px;

            padding: 20px 8px;
        }

        .number {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(28px, 6vw, 42px);
            color: #A87952;
            font-weight: 500;
        }

        .label {
            display: block;
            color: #8B7968;
            font-size: 9px;
            letter-spacing: 2px;
            margin-top: 7px;
        }

        .message {
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
            font-style: italic;
            color: #8B7968;
            margin-top: 30px;
        }

        .bottom {
            color: #A87952;
            font-size: 23px;
            margin-top: 28px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 17px;
            }

            .heading {
                font-size: 9px;
                letter-spacing: 2.5px;
            }

            .subtitle {
                font-size: 10px;
                letter-spacing: 2.5px;
            }

            .countdown {
                gap: 7px;
            }

            .box {
                padding: 17px 3px;
            }

            .label {
                font-size: 8px;
                letter-spacing: 1px;
            }

            .date {
                font-size: 26px;
            }

            .message {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="decoration">✦ ❧ ✦</div>

        <div class="heading">
            ONE LOVE · ONE PROMISE · ONE JOURNEY
        </div>

        <div class="names">
            James & Chileshe
        </div>

        <div class="subtitle">
            THE WEDDING CELEBRATION
        </div>

        <div class="line"></div>

        <div class="date">
            14 November 2026
        </div>

        <div class="time">
            SATURDAY · 09:00 HOURS
        </div>

        <div class="line"></div>

        <div class="countdown-title">
            Counting Down to Forever
        </div>

        <div class="countdown">

            <div class="box">
                <span class="number" id="days">00</span>
                <span class="label">DAYS</span>
            </div>

            <div class="box">
                <span class="number" id="hours">00</span>
                <span class="label">HOURS</span>
            </div>

            <div class="box">
                <span class="number" id="minutes">00</span>
                <span class="label">MINUTES</span>
            </div>

            <div class="box">
                <span class="number" id="seconds">00</span>
                <span class="label">SECONDS</span>
            </div>

        </div>

        <div class="message" id="message">
            A beautiful forever is almost here...
        </div>

        <div class="bottom">
            ✦ ❧ ✦
        </div>

    </div>

    <script>

        // Wedding date: 14 November 2026 at 09:00 Zambia time
        const weddingDate = new Date(
            "2026-11-14T09:00:00+02:00"
        ).getTime();

        function updateCountdown() {

            const now = new Date().getTime();

            const difference = weddingDate - now;

            if (difference <= 0) {

                document.getElementById("days").textContent = "00";
                document.getElementById("hours").textContent = "00";
                document.getElementById("minutes").textContent = "00";
                document.getElementById("seconds").textContent = "00";

                document.getElementById("message").textContent =
                    "Today, forever begins!";

                return;
            }

            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference % (1000 * 60 * 60 * 24)) /
                (1000 * 60 * 60)
            );

            const minutes = Math.floor(
                (difference % (1000 * 60 * 60)) /
                (1000 * 60)
            );

            const seconds = Math.floor(
                (difference % (1000 * 60)) / 1000
            );

            document.getElementById("days").textContent =
                String(days).padStart(2, "0");

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);

    </script>

</body>
</html>
